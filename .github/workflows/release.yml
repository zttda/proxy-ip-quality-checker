name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        shell: powershell
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GOAMD64: v1
        run: |
          New-Item -ItemType Directory -Path dist\ProxyIPCheck -Force | Out-Null
          go build -tags gui -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o dist\ProxyIPCheck\ipcheck.exe .
          go build -trimpath -ldflags "-s -w" -o dist\ipquality-helper.exe .\cmd\ipquality-helper
          $gitExe = (Get-Command git).Source
          $gitRoot = Split-Path (Split-Path $gitExe -Parent) -Parent
          .\tools\prepare_ipquality_runtime.ps1 `
            -GitRoot $gitRoot `
            -OutputDirectory dist\ProxyIPCheck\runtime `
            -HelperPath dist\ipquality-helper.exe
          Copy-Item config.json, README.md, LICENSE, THIRD_PARTY_NOTICES.txt -Destination dist\ProxyIPCheck
          New-Item -ItemType Directory -Path dist\ProxyIPCheck\ipquality -Force | Out-Null
          Copy-Item third_party\ipquality\ip.sh, third_party\ipquality\LICENSE, third_party\ipquality\UPSTREAM.md -Destination dist\ProxyIPCheck\ipquality
          Compress-Archive -Path dist\ProxyIPCheck\* -DestinationPath dist\ProxyIPCheck-windows-amd64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist\ProxyIPCheck-windows-amd64.zip).Hash.ToLowerInvariant()
          "$hash  ProxyIPCheck-windows-amd64.zip" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist\ProxyIPCheck-windows-amd64.zip `
            dist\SHA256SUMS.txt `
            --verify-tag `
            --title "Proxy IP Quality Checker ${{ github.ref_name }}" `
            --generate-notes
