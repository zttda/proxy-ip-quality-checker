name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        shell: powershell
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Path dist\ProxyIPCheck -Force | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist\ProxyIPCheck\ipcheck.exe .
          Copy-Item config.json, README.md, LICENSE -Destination dist\ProxyIPCheck
          Compress-Archive -Path dist\ProxyIPCheck\* -DestinationPath dist\ProxyIPCheck-windows-amd64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist\ProxyIPCheck-windows-amd64.zip).Hash.ToLowerInvariant()
          "$hash  ProxyIPCheck-windows-amd64.zip" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist\ProxyIPCheck-windows-amd64.zip `
            dist\SHA256SUMS.txt `
            --verify-tag `
            --title "Proxy IP Quality Checker ${{ github.ref_name }}" `
            --generate-notes
